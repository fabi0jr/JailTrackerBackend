name: Backend CI/CD Pipeline

on:
  push:
    branches: ['dev']

jobs:
  # ---------------------------------------------------
  # JOB 1: O "Guarda-Costas" (Testes e Qualidade)
  # ---------------------------------------------------
  teste-codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci 

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test

  # ---------------------------------------------------
  # JOB 2: O "Entregador" (Deploy no Render)
  # ---------------------------------------------------
  deploy-render:
    runs-on: ubuntu-latest
    needs: teste-codigo
    steps:
      - name: Avisar o Render para fazer o Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST $DEPLOY_HOOK_URL